<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vb-title vb-desc">
  <title id="vb-title">Voice bot QA agent architecture</title>
  <desc id="vb-desc">Pipeline diagram: Twilio, Deepgram, Groq, and ElevenLabs chained together, with transcript, recording, and bug analysis saved automatically after each call, feeding a human-reviewed bug report.</desc>
  <defs>
    <marker id="vbarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="420" fill="none"/>

  <text x="32" y="30" font-family="sans-serif" font-size="13" fill="#5F5E5A">Real-time call pipeline</text>

  <!-- Twilio -->
  <g>
    <rect x="32" y="44" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="102" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Twilio</text>
    <text x="102" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Call + audio stream</text>
  </g>

  <line x1="172" y1="72" x2="208" y2="72" stroke="#5F5E5A" stroke-width="1" marker-end="url(#vbarrow)"/>

  <!-- Deepgram -->
  <g>
    <rect x="208" y="44" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="278" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Deepgram</text>
    <text x="278" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Live transcription</text>
  </g>

  <line x1="348" y1="72" x2="384" y2="72" stroke="#5F5E5A" stroke-width="1" marker-end="url(#vbarrow)"/>

  <!-- Groq -->
  <g>
    <rect x="384" y="44" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
    <text x="454" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Groq</text>
    <text x="454" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Patient brain (LLM)</text>
  </g>

  <line x1="524" y1="72" x2="560" y2="72" stroke="#5F5E5A" stroke-width="1" marker-end="url(#vbarrow)"/>

  <!-- ElevenLabs -->
  <g>
    <rect x="560" y="44" width="88" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="604" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">11Labs</text>
    <text x="604" y="84" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#993C1D">Voice (TTS)</text>
  </g>

  <!-- Loop back: synthesized reply streamed to Twilio -->
  <path d="M604 100 V134 H102 V140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#vbarrow)"/>
  <text x="354" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Synthesized reply streamed back to the call</text>

  <line x1="32" y1="156" x2="648" y2="156" stroke="#D3D1C7" stroke-width="1"/>

  <text x="32" y="184" font-family="sans-serif" font-size="13" fill="#5F5E5A">Saved automatically after each call</text>

  <!-- Transcript -->
  <g>
    <rect x="32" y="198" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="122" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Transcript</text>
    <text x="122" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Both sides, saved as text</text>
  </g>

  <!-- Recording -->
  <g>
    <rect x="250" y="198" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="340" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Recording</text>
    <text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Downloaded as MP3</text>
  </g>

  <!-- Auto bug analysis -->
  <g>
    <rect x="468" y="198" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="558" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Auto bug analysis</text>
    <text x="558" y="238" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5F5E5A">LLM review vs. test goal</text>
  </g>

  <line x1="558" y1="254" x2="558" y2="288" stroke="#5F5E5A" stroke-width="1" marker-end="url(#vbarrow)"/>

  <!-- Final bug report -->
  <g>
    <rect x="398" y="288" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="523" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Human-reviewed bug report</text>
    <text x="523" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Final, curated findings</text>
  </g>

  <text x="32" y="396" font-family="sans-serif" font-size="12" fill="#5F5E5A">10 patient personas drive each call — identity edge cases, safety scenarios,</text>
  <text x="32" y="414" font-family="sans-serif" font-size="12" fill="#5F5E5A">data-entry stress, and a cooperative happy-path baseline.</text>
</svg>
